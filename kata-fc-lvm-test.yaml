---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kata-fc-lvm-pvc
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  storageClassName: openebs-lvm
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-kata-fc-lvm
  labels:
    app: test-kata-fc-lvm
spec:
  runtimeClassName: kata-fc
  restartPolicy: Never
  containers:
    - name: block-tester
      image: alpine:latest
      command:
        - /bin/sh
        - -c
        - |
          echo "Checking raw block device inside Firecracker microVM:"
          ls -l /dev/xvda
          echo "Writing test signature to block device..."
          echo "KATA-FC-OPENEBS-LVM-OK" | dd of=/dev/xvda bs=512 count=1
          echo "Reading back signature from block device:"
          dd if=/dev/xvda bs=512 count=1 2>/dev/null | tr -d '\0'
          echo "Test complete. Sleeping to allow inspection..."
          sleep 3600
      volumeDevices:
        - name: lvm-block-volume
          devicePath: /dev/xvda
  volumes:
    - name: lvm-block-volume
      persistentVolumeClaim:
        claimName: kata-fc-lvm-pvc
