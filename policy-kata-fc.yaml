apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-kata-fc-sandboxes
  annotations:
    policies.kyverno.io/title: Enforce Kata Firecracker and Network Isolation on Sandboxes
    policies.kyverno.io/description: Automatically assigns the kata-fc RuntimeClass, OpenEBS LVM storage, and same-namespace Cilium isolation to all Kampfire sandboxes.
spec:
  rules:
  # 1. Enforce kata-fc RuntimeClass on Agent Sandbox Pods
  - name: mutate-runtimeclass
    match:
      resources:
        kinds:
        - Pod
        selector:
          matchExpressions:
          - key: agents.x-k8s.io/sandbox-name-hash
            operator: Exists
    mutate:
      patchStrategicMerge:
        spec:
          +(runtimeClassName): kata-fc

  # 2. Enforce OpenEBS LVM StorageClass on Agent Sandbox PVCs
  - name: mutate-sandbox-pvc
    match:
      resources:
        kinds:
        - PersistentVolumeClaim
        selector:
          matchExpressions:
          - key: agents.x-k8s.io/sandbox-name-hash
            operator: Exists
    mutate:
      patchStrategicMerge:
        spec:
          +(storageClassName): openebs-lvm

  # 3. Auto-generate Cilium Same-Namespace Isolation Policy in the Sandbox's Namespace
  - name: generate-cilium-isolation-policy
    match:
      resources:
        kinds:
        - Pod
        selector:
          matchExpressions:
          - key: agents.x-k8s.io/sandbox-name-hash
            operator: Exists
    generate:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      name: isolate-kampfire-sandboxes
      namespace: "{{request.namespace}}"
      synchronize: true
      data:
        spec:
          description: "Strict isolation for Agent sandboxes: only allow communication with pods in the same namespace, blocking all cross-namespace traffic."
          endpointSelector:
            matchExpressions:
            - key: agents.x-k8s.io/sandbox-name-hash
              operator: Exists
          ingress:
          - fromEndpoints:
            - matchLabels: {}
          egress:
          # 1. Allow communication with pods in the same namespace
          - toEndpoints:
            - matchLabels: {}

          # 2. Allow DNS to cluster DNS (CoreDNS in kube-system)
          - toEndpoints:
            - matchLabels:
                "k8s:io.kubernetes.pod.namespace": "kube-system"
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY

          # 3. Allow DNS to nodelocaldns (169.254.25.10 / host)
          - toEntities:
            - host
            - remote-node
            toPorts:
            - ports:
              - port: "53"
                protocol: ANY

          # 4. Allow full outbound Internet access (HTTP, HTTPS, git, external APIs)
          - toEntities:
            - world
