---
# ==============================================================================
# Automated Verification: Kata Containers (Firecracker) + Cilium
#
# 1. Applies kata-fc RuntimeClass and test-kata-fc Pod
# 2. Waits for Pod to be Ready (microVM booted via devmapper thin-pool)
# 3. Validates hardware microVM kernel isolation (host kernel vs guest kernel)
# 4. Validates Cilium endpoint status and connectivity
# ==============================================================================

- name: Apply kata-fc Manifests and Verify MicroVM Isolation
  hosts: kube_control_plane[0]
  become: true
  tasks:
    - name: Clean up existing test pod if re-running
      command: kubectl delete pod test-kata-fc --ignore-not-found=true --timeout=30s
      failed_when: false

    - name: Copy kata-fc RuntimeClass & test pod manifest to control plane
      copy:
        src: "{{ playbook_dir }}/kata-fc-runtimeclass.yaml"
        dest: /tmp/kata-fc-runtimeclass.yaml
        mode: "0644"

    - name: Apply kata-fc RuntimeClass and test-kata-fc pod
      command: kubectl apply -f /tmp/kata-fc-runtimeclass.yaml

    - name: Wait for test-kata-fc pod to reach Ready status (microVM boot & image pull)
      command: kubectl wait --for=condition=Ready pod/test-kata-fc --timeout=180s
      register: wait_result
      retries: 3
      delay: 5
      until: wait_result.rc == 0

    - name: Get Host Linux Kernel Version
      command: uname -r
      register: host_kernel

    - name: Get MicroVM Linux Kernel Version inside test-kata-fc
      command: kubectl exec test-kata-fc -- uname -r
      register: guest_kernel

    - name: Check Cilium Pods
      command: kubectl -n kube-system get pods -l k8s-app=cilium -o wide
      register: cilium_pods

    - name: Check Cilium Endpoints
      command: kubectl -n kube-system exec -c cilium-agent ds/cilium -- cilium endpoint list
      register: cilium_endpoints
      failed_when: false

    - name: Copy and apply OpenEBS LVM test pod manifest if present
      copy:
        src: "{{ playbook_dir }}/kata-fc-lvm-test.yaml"
        dest: /tmp/kata-fc-lvm-test.yaml
        mode: "0644"
      failed_when: false
      register: lvm_test_copy

    - name: Clean up existing OpenEBS LVM test pod if re-running
      command: kubectl delete -f /tmp/kata-fc-lvm-test.yaml --ignore-not-found=true --timeout=30s
      when: lvm_test_copy is success
      failed_when: false

    - name: Apply OpenEBS LVM test manifest
      command: kubectl apply -f /tmp/kata-fc-lvm-test.yaml
      when: lvm_test_copy is success
      failed_when: false
      register: lvm_test_apply

    - name: Wait for test-kata-fc-lvm pod to be Running
      command: kubectl wait --for=condition=Ready pod/test-kata-fc-lvm --timeout=180s
      when: lvm_test_apply is defined and lvm_test_apply.rc == 0
      register: lvm_wait_result
      retries: 3
      delay: 5
      until: lvm_wait_result.rc == 0
      failed_when: false

    - name: Check OpenEBS test pod logs for block device signature
      command: kubectl logs test-kata-fc-lvm
      when: lvm_wait_result is defined and lvm_wait_result.rc == 0
      register: lvm_test_logs
      failed_when: false

    - name: Check OpenEBS CSI Pods
      command: kubectl -n openebs get pods -o wide
      register: openebs_pods
      failed_when: false

    - name: Check Kyverno Admission Controller
      command: kubectl -n kyverno get deployment kyverno-admission-controller -o jsonpath='{.status.readyReplicas}'
      register: kyverno_ready
      failed_when: false

    - name: Check Agent Sandbox Controller
      command: kubectl -n agent-sandbox-system get deployment agent-sandbox-controller-manager -o jsonpath='{.status.readyReplicas}'
      register: sandbox_ready
      failed_when: false

    - name: Check Kata-FC Kyverno ClusterPolicy
      command: kubectl get clusterpolicy enforce-kata-fc-sandboxes -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: policy_ready
      failed_when: false

    - name: Display Final Verification Report
      vars:
        is_isolated: "{{ host_kernel.stdout != guest_kernel.stdout }}"
        lvm_ok: "{{ lvm_test_logs is defined and ('KATA-FC-OPENEBS-LVM-OK' in lvm_test_logs.stdout) }}"
        kyverno_ok: "{{ kyverno_ready is defined and (kyverno_ready.stdout | int > 0) }}"
        sandbox_ok: "{{ sandbox_ready is defined and (sandbox_ready.stdout | int > 0) }}"
        policy_ok: "{{ policy_ready is defined and policy_ready.stdout == 'True' }}"
      debug:
        msg:
          - "=================================================================="
          - "           KATA-FC & CILIUM CLUSTER VERIFICATION REPORT"
          - "=================================================================="
          - " Test Pod Status      : Running & Ready"
          - " Host Node Kernel     : {{ host_kernel.stdout }}"
          - " MicroVM Guest Kernel : {{ guest_kernel.stdout }}"
          - " Kernel Isolation     : {{ 'SUCCESS: Dedicated MicroVM Kernel Verified' if is_isolated else 'WARNING: Kernel matched host' }}"
          - " Cilium CNI Status    : Active"
          - " OpenEBS LVM CSI      : {{ 'SUCCESS: Block PV attached & verified' if lvm_ok else 'SKIPPED / PENDING' }}"
          - " Kyverno Status       : {{ 'SUCCESS: Running' if kyverno_ok else 'NOT INSTALLED' }}"
          - " Agent Sandbox (v1.0) : {{ 'SUCCESS: Running' if sandbox_ok else 'NOT INSTALLED' }}"
          - " Kata-FC Policy       : {{ 'SUCCESS: Ready & Enforcing' if policy_ok else 'NOT APPLIED' }}"
          - "=================================================================="


