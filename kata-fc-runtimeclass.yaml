---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
handler: kata-fc
overhead:
  podFixed:
    cpu: 100m
    memory: 130Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-kata-fc
  labels:
    app: test-kata-fc
spec:
  runtimeClassName: kata-fc
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
